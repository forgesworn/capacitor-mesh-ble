name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: ./gradlew test build
        working-directory: android
      - run: npm ci && npm run build && npx cap sync android
        working-directory: example-app
      - run: ./gradlew assembleDebug test
        working-directory: example-app/android

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xcodebuild -scheme CapacitorMeshBle -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO build
